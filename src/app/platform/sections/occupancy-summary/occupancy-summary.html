<div class="occupancy" [class.is-watch]="isNearCapacity()">
  <svg class="ring" width="96" height="96" viewBox="0 0 96 96" aria-hidden="true">
    <g transform="rotate(-90 48 48)">
      <circle class="ring-track" cx="48" cy="48" [attr.r]="ringRadius" />
      <circle
        class="ring-fill"
        cx="48"
        cy="48"
        [attr.r]="ringRadius"
        [attr.stroke-dasharray]="ring().fill"
      />
      @if (ring().hasOverflow) {
        <circle class="ring-overflow-gap" cx="48" cy="48" [attr.r]="ringRadius" [attr.stroke-dasharray]="ring().overflow" />
        <circle class="ring-overflow" cx="48" cy="48" [attr.r]="ringRadius" [attr.stroke-dasharray]="ring().overflow" />
      }
    </g>
    <line class="ring-tick" x1="48" y1="1" x2="48" y2="11" />
  </svg>

  <div class="figures">
    <div class="count">{{ metrics().totalCount }}</div>
    <div class="capacity">of {{ metrics().capacity }} capacity</div>
    <div class="percent">{{ metrics().percentFull }}% full</div>
  </div>
</div>
<p class="breaches">{{ breachesLabel() }}</p>
